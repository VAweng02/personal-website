<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toolkits — Vincent Weng</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/toolkits.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="description" content="Practical toolkits for data science, career growth, and personal optimization. Templates, frameworks, and dashboards by Vincent Weng." />
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main>
    <section class="hero" aria-label="Toolkits introduction">
      <div class="container hero__inner">
        <div class="hero__photo_about">
          <img src="img/toolkits_hero.jpg" alt="Toolkits illustration">
        </div>

        <div class="hero__content">
          <h1 class="hero__title_about">Toolkits</h1>
          <p class="hero__lede_about">
            Practical templates and frameworks for career growth and personal optimization built from real-world experience.
          </p>

          <div class="social-links">
            <a href="https://www.linkedin.com/in/vincentweng0/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/VAweng02" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://medium.com/@vweng" target="_blank"><i class="fab fa-medium"></i></a>
          </div>

        </div>
      </div>
    </section>

    <section class="toolkits-library" aria-label="Toolkits">
      <div class="container">
        <div class="categories" role="tablist" aria-label="Filter toolkits">
          <button class="category active" data-filter="all">All</button>
          <button class="category" data-filter="career">Career</button>
          <button class="category" data-filter="personal">Personal</button>
        </div>

        <div class="toolkit-grid" id="toolkit-grid"></div>
      </div>
    </section>
  </main>

  <div data-include="partials/footer.html"></div>

  <script src="scripts/toolkits.js"></script>
  <script src="scripts/includes.js"></script>
  <script src="scripts/site.js"></script>
</body>
</html>
