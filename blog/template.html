<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post Title</title>

  <!-- Global + Blog styles -->
  <link rel="stylesheet" href="../css/site.css" />
  <link rel="stylesheet" href="../css/blog.css" />
</head>

<body>
  <!-- Optional: navbar (if your site has one) -->
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">Your Name</a>
      <nav class="nav">
        <a href="../index.html">Home</a>
        <a href="../blog.html">Blog</a>
      </nav>
    </div>
  </header>

  <main class="container blog-layout">
    <!-- Article -->
    <article id="post-content" class="post">
      <header class="post-header">
        <h1 class="post-title">Blog Post Title</h1>
        <div class="post-meta">
          <span class="post-date">January 22, 2026</span>
          <span class="post-dot">•</span>
          <span class="post-readtime">6 min read</span>
        </div>
      </header>

      <!-- ===== START WRITING BELOW ===== -->

      <p>
        Short intro paragraph. What will this article help the reader do?
      </p>

      <h2>Section 1</h2>
      <p>Write here...</p>

      <h2>Section 2</h2>
      <p>Write here...</p>

      <h3>Optional Subsection</h3>
      <p>Write here...</p>

      <!-- ===== STOP WRITING ABOVE ===== -->
    </article>

    <!-- Table of Contents -->
    <aside class="toc">
      <div class="toc-card">
        <div class="toc-title">On this page</div>
        <nav id="toc"></nav>
      </div>
    </aside>
  </main>

  <!-- Optional: footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Your Name</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/toc.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
